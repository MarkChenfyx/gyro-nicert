# 交易引擎配置示例。复制为 executor/config.toml 后修改（config.toml 不提交）。
# 路径相对于项目根目录（gyro_nicert/）。资金账号等真实信息只写在服务器本地的 config.toml。

[engine]
mode = "backtest"                     # backtest / paper / live
live_trading = false                  # 只有 mode = "live" 且这里为 true 才会真实下单
data_dir = "storage/executor/ticks"   # 行情文件目录（录制或下载），回测从这里读
runtime_dir = "storage/executor_v2"      # 数据库、日志、停止文件所在目录
commission_bp = 1.0                   # 回测手续费（单边，基点）；账户实际约 0.1
max_quote_age_seconds = 90            # 行情超过这么久没更新视为过期，不据此交易
snapshot_wait_seconds = 2             # 实时报价窗口结束后等待的秒数；状态在每个业务事件后提交
recording_dir = "storage/executor_v2/recordings" # 原始事件按启动会话分片录制
# warmup_start = "2026-01-01"          # 可选：首次启动的只读历史预热区间
# warmup_end = "2026-02-01"
tplus1 = []                           # T+1 标的（A 股宽基等）；跨境、港股、黄金为 T+0

[sim]                                 # 回测和纸面模式的模拟撮合
latency_seconds = 0                   # 报单到可成交的延迟
fill_ratio = 1.0                      # <1 时测试部分成交
reject_rate = 0.0                     # >0 时测试随机拒单

[risk]
stop_file = "storage/executor/STOP"   # 该文件存在时拒绝一切新委托
band_pct = 1.0                        # 限价偏离中间价超过该百分比拒单
max_order_value = 2000000
max_intents_per_day = 20
max_daily_loss_pct = 15.0            # 防程序异常的熔断；策略满仓，指数单日大跌也会计入，不宜设太小

[qmt]                                 # 纸面模式只用 QMT 行情，不登录账户，以下账户项仅实盘需要
account_mode = "dedicated"             # 当前实盘仅支持专用资金账户
userdata_path = ""                    # QMT 安装目录下的 userdata_mini 路径
account_id = ""                       # 资金账号（只写在服务器本地）

